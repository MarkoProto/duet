# cargo deny check: known security advisories, licences, duplicate or wildcard dependencies,
# and where crates come from. Runs in CI on every push.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unmaintained crates and yanked versions included.
yanked = "deny"

[licenses]
# Permissive licences only, so Duet can stay MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates point at each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
