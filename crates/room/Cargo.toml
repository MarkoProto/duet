[package]
name = "duet-room"
description = "One pair's room: the clock, the relay and the page. Runs inside a sandbox, or inside the lobby."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
duet-embed = { path = "../embed" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tower = { version = "0.5", features = ["util"] }
getrandom = "0.3"

[dev-dependencies]
tokio-tungstenite = "0.30"

[build-dependencies]
duet-embed = { path = "../embed", features = ["build"] }
