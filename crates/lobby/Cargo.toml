[package]
name = "duet"
description = "The lobby: names, questions, matching, rooms, votes and tomorrow."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

# The pages are packed into code by build.rs, and that generated code is what calls duet-embed.
[package.metadata.cargo-machete]
ignored = ["duet-embed"]

[dependencies]
duet-embed = { path = "../embed" }
duet-room = { path = "../room" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "process"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "multipart", "query"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
axum = { version = "0.8.9", default-features = false, features = ["multipart"] }

[build-dependencies]
duet-embed = { path = "../embed", features = ["build"] }
